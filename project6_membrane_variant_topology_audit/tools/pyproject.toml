[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane-rule-audit"
version = "0.1.0"
description = "Reusable within-site analysis of membrane-protein mutation scores"
readme = {text = "Audit biological-rule contrasts and refinements in protein variant scores.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
membrane-rule-audit = "membrane_rule_audit.audit:main"
membrane-rule-panel = "membrane_rule_audit.panel:main"
disulfide-rule-audit = "membrane_rule_audit.disulfide:main"
proline-rule-audit = "membrane_rule_audit.proline:main"
multi-rule-refine = "membrane_rule_audit.refinement:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["membrane_rule_audit*"]
